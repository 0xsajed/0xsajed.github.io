<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <!-- fonts -->
    <link
      href="https://fonts.googleapis.com/css?family=Open+Sans"
      rel="stylesheet"
    >
    <link
      href="https://fonts.googleapis.com/css?family=Oswald"
      rel="stylesheet"
    >

    <!-- bootstrap -->
    <link rel="stylesheet" href="/css/bootstrap.min.css">

    <!-- icons -->
    <script
      src="https://kit.fontawesome.com/6ac3910c4e.js"
      crossorigin="anonymous"
    ></script>

    <!-- three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <!-- bootstrap javascript -->
    <script src="/js/bootstrap.bundle.min.js" defer></script>

<title>3D rubiks cube solver</title>
</head>

  <body class="bg-beige">
    <nav class="navbar navbar-expand-sm bg-dark navbar-dark">
      <div class="container-fluid">
        <h2 class="navbar-brand">Rubiks cube solver</h2>
        
        <ul class="navbar-nav ms-auto">
          <li class="nav-item">
            <a class="nav-link" href="/projects/cube-solver/about.html">About this project</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/index.html">Home</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="../index.html">Projects</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="models.html">Models</a>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="/0xsajed.github.io/about/index.html">About</a>
          </li>
        </ul>
      </div>
    </nav>

<div class="container mt-3">
  <div style="width: 100%; max-width: 300px;">
    <label for="cubeSelect" class="form-label">Choose cube</label>

    <select id="cubeSelect" class="form-select">
      <option value="models/regular.glb">3×3 Cube</option>
      <option value="models/mirror.glb">Mirror Cube</option>
      <option value="models/mastermorphix.glb">Mastermorphix</option>
    </select>
  </div>
</div>

    <main class="container">
      <section>
        <div class="row">
          <div class="col-12">
            <h1>3D Cube Viewer</h1>
              <div
                id="cube-viewer"
                class="mx-auto"
                style="width: 100%; max-width: 600px;"
              >
                <canvas
                  id="cubeCanvas"
                  style="display: block; width: 100%;"
                ></canvas>
              </div>
          </div>
        </div>
      </section>

      <section>
        <div class="row">
          <div class="col-12">
            <h2>Controls</h2>
            <label for="moves">Moves</label>
            <input id="moves" name="moves" type="text" placeholder="e.g. R U R' U'">
          </div>
        </div>

        <div class="row">
          <div class="col-sm">
            <button id="executeButton" type="button">Execute</button>
          </div>
          <div class="col-sm">
            <button id="scrambleButton" type="button">Scramble</button>
          </div>
          <div class="col-sm">
            <button id="solveButton" type="button">Solve</button>
          </div>
          <div class="col-sm">
            <button id="resetButton"  type="button">Reset</button>
          </div>
          <div class="col-sm">
            <button
              id="wireframeButton"
              type="button"
              aria-pressed="false"
            >Wireframe: Off</button>
          </div>
        </div>
      </section>

      <section>
        <div class="row">
          <div class="col-12">
            <h2>Solution</h2>
            <p id="solution">Solution steps will appear here.</p>
          </div>
        </div>
      </section>
    </main>

    <footer class="container">
      <div class="row">
        <div class="col-12">
          <p></p>
        </div>
      </div>
    </footer>

<script src="cubejs/cube.js"></script>
<script src="cubejs/solve.js"></script>

<script src="cube-viewer.js"></script>
<script src="cube-animation.js"></script>
<script src="mastermorphix-solver.js"></script>
<script src="main.js"></script>
  </body>
</html>
